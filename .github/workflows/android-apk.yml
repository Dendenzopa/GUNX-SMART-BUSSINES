name: GUNX Android standalone APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'App.tsx'
      - 'src/**'
      - 'assets/**'
      - 'app.json'
      - 'eas.json'
      - 'package.json'
      - 'tsconfig.json'
  workflow_dispatch:
  workflow_call:

jobs:
  android-standalone-apk:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java 17 for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare splash logo as PNG
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert assets/gunx-smart-business-logo.jpg -strip -interlace none assets/gunx-smart-business-logo-splash.png
          identify assets/gunx-smart-business-logo-splash.png
      - name: Generate native Android project
        run: CI=1 npx expo prebuild --platform android
      - name: Build standalone release APK with embedded JavaScript bundle
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify APK contains embedded JavaScript bundle
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -l "$APK" | grep -E 'assets/index.android.bundle|assets/index.android.bundle.hbc'
      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: gunx-smart-business-android-standalone
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
