name: Owner Dashboard Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "App.tsx"
      - "package.json"
      - "app.json"
      - "tsconfig.json"
      - ".github/workflows/owner-dashboard-check.yml"
  push:
    branches: [preview/owner-dashboard-reference]

jobs:
  validate:
    name: TypeScript and Expo web export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: TypeScript validation
        run: npm run typecheck
      - name: Export Expo web build
        run: npm run build:web
      - name: Upload owner dashboard preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: gunx-owner-dashboard-preview
          path: dist/
          if-no-files-found: error
          retention-days: 7
