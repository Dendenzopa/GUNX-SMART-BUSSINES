name: GUNX SMART BUSINESS CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
      - name: Prepare splash logo as PNG
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert assets/GUNX20Smart20Business20Logo-1.jpg -strip -interlace none assets/gunx-smart-business-logo-splash.png
          identify assets/gunx-smart-business-logo-splash.png
      - name: Expo web export
        run: npm run build:web
