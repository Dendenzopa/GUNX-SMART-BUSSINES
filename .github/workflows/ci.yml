name: GUNX SMART BUSINESS CI

on:
  push:
    branches: [main, master, feature/email-auth-recovery, feature/white-login-screen]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
      - name: Prepare splash logo as PNG
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert assets/GUNX20Smart20Business20Logo-1.jpg -strip -interlace none assets/gunx-smart-business-logo-splash.png
          identify assets/gunx-smart-business-logo-splash.png
      - name: Expo web export
        run: npm run build:web
