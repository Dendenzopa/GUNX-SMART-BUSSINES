name: GUNX SMART BUSINESS CI

on:
  push:
    branches: [main, master, feature/email-auth-recovery, feature/white-login-screen, feat/business-owner-dashboard-design]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
      - name: Refund allocation regression tests
        run: npm run test:refund-allocation
      - name: Employee invitation migration static security checks
        run: npm run test:employee-invitation-migration
      - name: Platform privacy and refund migration security checks
        run: npm run test:platform-privacy-migration
      - name: Prepare splash logo as PNG
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert "assets/file_0000000053fc820e80926a65f6d512e7.png" -strip -interlace none assets/gunx-smart-business-logo-splash.png
          identify assets/gunx-smart-business-logo-splash.png
      - name: Expo web export
        run: npm run build:web
