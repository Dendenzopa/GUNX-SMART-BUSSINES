name: GUNX SMART BUSINESS CI

on:
  push:
    branches: [main, master, feature/email-auth-recovery]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Save generated lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/email-auth-recovery'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: generate npm package lockfile" || echo "Lockfile is already up to date"
          git pull --rebase origin feature/email-auth-recovery
          git push origin HEAD:feature/email-auth-recovery
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
      - name: Prepare splash logo as PNG
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert assets/GUNX20Smart20Business20Logo-1.jpg -strip -interlace none assets/gunx-smart-business-logo-splash.png
          identify assets/gunx-smart-business-logo-splash.png
      - name: Expo web export
        run: npm run build:web
